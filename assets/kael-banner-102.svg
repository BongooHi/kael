<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111B"/>
      <stop offset="55%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#1E1E2E"/>
    </linearGradient>
    <linearGradient id="prism" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61D1FF"/>
      <stop offset="48%" stop-color="#CBA6F7"/>
      <stop offset="100%" stop-color="#FF8073"/>
    </linearGradient>
    <linearGradient id="prismDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61D1FF"/>
      <stop offset="50%" stop-color="#C775FF"/>
      <stop offset="100%" stop-color="#FF8073"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#61D1FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#61D1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CBA6F7" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#CBA6F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8073" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF8073" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="8" y="8" width="1184" height="324" rx="28"/>
    </clipPath>
  </defs>

  <!-- Outer card with rainbow edge glow -->
  <rect x="8" y="8" width="1184" height="324" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#cardClip)">
    <circle cx="210" cy="70" r="240" fill="url(#orb1)"/>
    <circle cx="960" cy="270" r="260" fill="url(#orb2)"/>
    <circle cx="640" cy="40" r="190" fill="url(#orb3)"/>
  </g>
  <rect x="8" y="8" width="1184" height="324" rx="28" fill="none" stroke="url(#prismDiag)" stroke-width="3.5" opacity="0.88"/>
  <rect x="14" y="14" width="1172" height="312" rx="23" fill="none" stroke="url(#prismDiag)" stroke-width="1" opacity="0.32"/>

  <!-- Emblem -->
  <g transform="translate(116, 102)">
    <rect x="0" y="0" width="136" height="136" rx="34" fill="#181825" stroke="url(#prismDiag)" stroke-width="4.5"/>
    <circle cx="68" cy="68" r="42" fill="none" stroke="url(#prismDiag)" stroke-width="2.5" opacity="0.35"/>
    <path d="M48 40 V96 M48 68 L84 40 M60 58 L88 96" fill="none" stroke="url(#prismDiag)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Tagline -->
  <g transform="translate(292, 136)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="68" font-weight="800" fill="#CDD6F4" letter-spacing="-1.5">Kael</text>
    <rect x="164" y="-44" width="84" height="32" rx="16" fill="#CBA6F7" fill-opacity="0.18" stroke="#CBA6F7" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="206" y="-23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#CBA6F7">1.0.2</text>

    <text x="0" y="42" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="500" fill="#A6ADC8">
      Always-Listening Linux AI Voice Assistant
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="166" height="34" rx="17" fill="#28293D" stroke="#61D1FF" stroke-opacity="0.45"/>
      <text x="83" y="22" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#74C7EC">Gemini 3.8 Live</text>

      <rect x="180" y="0" width="176" height="34" rx="17" fill="#28293D" stroke="#CBA6F7" stroke-opacity="0.45"/>
      <text x="268" y="22" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#CBA6F7">Offline Wake Word</text>

      <rect x="370" y="0" width="162" height="34" rx="17" fill="#28293D" stroke="#FAB387" stroke-opacity="0.45"/>
      <text x="451" y="22" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#FAB387">OpenGL Edge HUD</text>

      <rect x="546" y="0" width="160" height="34" rx="17" fill="#28293D" stroke="#A6E3A1" stroke-opacity="0.45"/>
      <text x="626" y="22" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#A6E3A1">Qt6 QML Settings</text>
    </g>
  </g>
</svg>
